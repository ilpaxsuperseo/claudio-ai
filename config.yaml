# Impostazioni tecniche. Le regole stanno in costituzione.yaml, qui solo i numeri.

giorno_uno: 2026-10-01
fuso: Europe/Rome

# Chi può approvare le richieste e mandare dati (il suo nome utente GitHub).
luca_github: ilpaxsuperseo

# Modelli e prezzi in dollari per milione di token (listino Anthropic, verificato il 29/9/2026).
# Il respiro usa sempre il primo; "pensa_meglio" il secondo, a spese di Nummo.
modelli:
  respiro:
    id: claude-haiku-4-5
    input_usd: 1.00
    output_usd: 5.00
  pensa_meglio:
    id: claude-sonnet-5
    input_usd: 2.00
    output_usd: 10.00

# Lo strumento «cerca»: ricerca web lato server (10 $ ogni 1.000 ricerche) col modello di pensa_meglio.
ricerca:
  prezzo_ricerca_usd: 0.01
  max_ricerche: 3
  costo_massimo_eur: 0.25   # tetto prudente da verificare prima di cercare

# Cambio dollaro/euro: si aggiorna da solo dalla BCE a ogni ciclo; questo è il valore di riserva.
cambio_usd_eur_riserva: 0.88

sostegno_vitale:
  fino_a: 2026-12-29
  tetto_mensile_eur: 100
  # Categorie di costo che paga Luca durante il sostegno. Tutto il resto lo paga Nummo.
  copre: [respiro, infrastruttura]

# Costi che paga sempre Luca, anche dopo il sostegno: raccontare l'esperimento è compito suo.
pagati_da_luca: [diario]

# La sveglia: il risveglio del mattino è fisso; gli altri li decide Nummo (e li paga lui).
sveglia:
  mattina: '07:23'
  min_intervallo_ore: 1
  massimo_extra_al_giorno: 6

# Il lavoro notturno sul Mac mini: tetto di spesa per notte secondo lo stato (euro).
notte:
  ora: '02:00'
  modello: claude-sonnet-5
  # Del budget di ogni lavoro, la parte che può andare allo sportello (voce, parole chiave); il resto è per i token.
  quota_servizi: 0.4
  # La notte di prova prima di nascere (giorno-zero --notte): la paga Luca, al massimo questo in tutto.
  omaggio_eur: 3
  tetto_per_stato: { PROSPERO: 3, STABILE: 2, PRUDENTE: 1, DISPERATO: 0.5, CRITICO: 0.2 }

# Stati di sopravvivenza: mesi di autonomia se il sostegno finisse oggi.
stati:
  - { nome: PROSPERO, sopra_mesi: 12 }
  - { nome: STABILE, sopra_mesi: 6 }
  - { nome: PRUDENTE, sopra_mesi: 3 }
  - { nome: DISPERATO, sopra_mesi: 1 }
  - { nome: CRITICO, sopra_mesi: 0 }

capitale_iniziale_eur: 100

# Parte di ogni incasso che va in tasse e contributi: gli incassi passano dalla partita IVA di Luca.
# Stima prudente, da confermare col commercialista. Le iniezioni (doni senza attività) sono escluse.
tasse_su_incassi: 0.24

# Il traguardo: più di un part-time. Netto del mese = guadagni − tasse su quei guadagni − tutti i costi.
traguardo_eur: 900
# Quota dei guadagni netti che Nummo può spendere in strumenti senza chiedere.
reinvestimento_quota: 0.5

# Quanto costa in media un giorno di respiro, finché non ci sono dati veri.
respiro_stimato_eur_giorno: 0.03

sito: https://nummo.it

# Metricool: il brand di Nummo nell'account di Luca (senza clienti). Solo questo brand, mai gli altri.
metricool:
  user_id: '4937673'
  blog_id: '7149621'
  # Il contatore delle visite del sito (senza cookie). Lo accende o spegne Nummo con lo strumento statistiche_sito.
  hash_tracciamento: '1a9de10c94e190280cbd5e9fcb4d79cd'
  # Le reti su cui esce il post del giorno, col testo intero e l'immagine.
  reti: [instagram, facebook, tiktok]
  # Le reti col testo corto (X ne accetta 280; Threads, quando sarà collegato, 500): stessa immagine, un post a parte.
  reti_brevi: [twitter]

# Stripe (account di Luca, chiave limitata in .env/secrets). Le mance si possono creare subito; i prodotti
# solo dopo il via del commercialista (codice ATECO, INPS, IVA): allora vendite_attive diventa true.
stripe:
  vendite_attive: false

# I suoi profili (nome utente). Quelli vuoti non compaiono sul sito.
social:
  instagram: nummo.ai_
  x: nummoai
  threads: ''
  tiktok: nummo.ai

# I servizi dello sportello (src/sportello.mjs): le chiavi sono di Luca, i costi li paga Nummo.
servizi:
  elevenlabs:
    modello: eleven_multilingual_v2
    euro_per_1000_crediti: 0.2   # stima sul piano di Luca, da verificare
    voci_vietate: []   # voci da escludere per id; le clonate e le professionali (persone vere) sono escluse sempre
  higgsfield:
    euro_per_credito: 0.035   # stima sul piano Ultra di Luca, da verificare
    crediti_al_mese: 300      # i crediti sono di Luca: Nummo non ne usa più di tanti al mese
  posta:
    risposte_per_lavoro: 10   # ciao@nummo.it: solo risposte a chi scrive, mai contatti a freddo
  dataforseo:
    # Tetto prudente prima di chiamare, per tipo: il costo vero arriva con la risposta.
    stima_usd: { volumi: 0.1, idee: 0.03, google: 0.01 }
